<!-- index.html -->
<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعادة تعيين كلمة المرور</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f5f0eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    h2 { color: #4A3321; margin-bottom: 8px; font-size: 22px; }

    p.subtitle { color: #888; font-size: 14px; margin-bottom: 28px; }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;
      text-align: right;
    }

    input:focus { border-color: #503520; }

    button {
      width: 100%;
      padding: 13px;
      background: #503520;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s;
    }

    button:hover { background: #3d2818; }
    button:disabled { background: #aaa; cursor: not-allowed; }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .message.success { background: #e6f4ea; color: #2d7a3a; display: block; }
    .message.error   { background: #fdecea; color: #c0392b; display: block; }
  </style>
</head>
<body>
<div class="card">
  <h2>🔒 إعادة تعيين كلمة المرور</h2>
  <p class="subtitle">أدخل كلمة المرور الجديدة</p>

  <input type="password" id="password"     placeholder="كلمة المرور الجديدة" />
  <input type="password" id="passwordConf" placeholder="تأكيد كلمة المرور"   />

  <button id="btn" onclick="resetPassword()">تحديث كلمة المرور</button>

  <div class="message" id="msg"></div>
</div>


<script>
  // debug — shows full URL on screen
  document.addEventListener('DOMContentLoaded', () => {
    const debug = document.createElement('p');
    debug.style = 'font-size:11px; word-break:break-all; color:red; margin-top:10px;';
    debug.textContent = window.location.href;
    document.querySelector('.card').appendChild(debug);
  });

  function getParams() {
    const hashParams  = new URLSearchParams(window.location.hash.substring(1));
    const queryParams = new URLSearchParams(window.location.search);

    const token_hash = hashParams.get('token_hash') || queryParams.get('token_hash');
    const type       = hashParams.get('type')       || queryParams.get('type');

    console.log('Full URL:', window.location.href);
    console.log('token_hash:', token_hash);
    console.log('type:', type);

    return { token_hash, type };
  }

  async function resetPassword() {
    const password     = document.getElementById('password').value;
    const passwordConf = document.getElementById('passwordConf').value;
    const btn          = document.getElementById('btn');
    const msg          = document.getElementById('msg');

    msg.className   = 'message';
    msg.textContent = '';

    if (password.length < 6) {
      msg.className   = 'message error';
      msg.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
      return;
    }

    if (password !== passwordConf) {
      msg.className   = 'message error';
      msg.textContent = 'كلمتا المرور غير متطابقتين';
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'جاري التحديث...';

    const { token_hash, type } = getParams();

    const res = await fetch('/api/update-password', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ token_hash, type, password }),
    });

    const data = await res.json();

    if (!res.ok) {
      msg.className   = 'message error';
      msg.textContent = 'حدث خطأ: ' + data.error;
      btn.disabled    = false;
      btn.textContent = 'تحديث كلمة المرور';
    } else {
      msg.className   = 'message success';
      msg.textContent = '✅ تم تحديث كلمة المرور بنجاح!';
      btn.textContent = 'تم ✓';
    }
  }
</script>
</body>
</html>
